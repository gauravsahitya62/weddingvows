name: Deploy WordPress Code to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/**'
      - '.github/workflows/deploy-live.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PHP
        run: |
          set -euo pipefail
          find wp-content -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate deployment settings
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo 'Missing DEPLOY_HOST'; exit 1; }
          test -n "$DEPLOY_USER" || { echo 'Missing DEPLOY_USER'; exit 1; }
          test -n "$DEPLOY_PORT" || { echo 'Missing DEPLOY_PORT'; exit 1; }
          test -n "$DEPLOY_PATH" || { echo 'Missing DEPLOY_PATH'; exit 1; }

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY_B64" || { echo 'Missing DEPLOY_SSH_KEY_B64'; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'Missing DEPLOY_KNOWN_HOSTS'; exit 1; }
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Verify SSH access
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" 'printf "SSH connection OK\\n"'

      - name: Verify live WordPress directory
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -d '$DEPLOY_PATH/wp-content'"

      - name: Deploy wp-content to Hostinger
        run: |
          set -euo pipefail
          rsync -az --omit-dir-times \
            -e "ssh -p $DEPLOY_PORT -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            wp-content/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/wp-content/"

      - name: Report deployment
        run: echo "Live deployment completed for commit $GITHUB_SHA"
